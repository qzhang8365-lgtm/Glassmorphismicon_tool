:8px"><label for="glyphX">水平 <output id="glyphXValue">0 px</output></label><input style="width:100%;accent-color:#2563eb" id="glyphX" type="range" min="-16" max="16" step="0.5" value="0"></div><div><label for="glyphY">垂直 <output id="glyphYValue">0 px</output></label><input style="width:100%;accent-color:#2563eb" id="glyphY" type="range" min="-16" max="16" step="0.5" value="0"></div><button id="centerGlyph" style="margin-top:8px">恢复居中</button><p class="tiny">以112px画布为基准；水平正值向右，垂直正值向下。只移动白色图案，用于校准视觉中心。</p></div><div class="upload"><input type="file" id="upload" accept=".svg,.png,image/svg+xml,image/png" hidden><div style="display:flex;align-items:center;gap:8px;margin-top:8px"><div id="customLabel" style="flex:1"></div><button id="deleteCustom" type="button" hidden style="font-size:12px;padding:4px 10px">删除</button></div><p class="tiny">SVG 线条统一为白色圆端点；填充图形保留轮廓并转白色。PNG 按透明通道转白色，适合透明背景图标。</p></div></section><section><h2>04　后层偏移方向</h2><div class="grid" id="directions"></div><div style="margin-top:12px"><label for="backDistance">偏移距离 <output id="backDistanceValue">8 px</output></label><input style="width:100%;accent-color:#2563eb" id="backDistance" type="range" min="0" max="16" step="0.5" value="8"><button id="resetBackDistance">恢复默认距离</button><p class="tiny">0–16px，步长0.5px（112px画布基准）。斜向时水平、垂直各偏移此距离；调整后整体自动居中。</p></div></section></div><div class="right-column"><div class="panel preview"><div class="bar" style="margin:0 0 14px"><strong style="flex:1">实时预览</strong><label style="font-size:12px;display:flex;align-items:center;gap:5px;white-space:nowrap"><input id="showGuides" type="checkbox" style="accent-color:#2B73FF">对齐辅助线</label><button data-bg="grid">透明</button><button data-bg="white">白底</button><button data-bg="dark">深色</button></div><div class="stage" id="stage"></div><div id="guideLegend" hidden style="text-align:center;font-size:11px;margin-top:10px"><span style="color:#2B73FF">蓝：画板中心</span>　<span style="color:#E77A27">橙：主体对齐中心</span>　<span style="color:#24A98B">绿：10px安全边距</span></div><div class="work-shelf"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><strong style="flex:1">作品暂存 <span id="workCount" style="font-size:12px;color:#74899b">0</span></strong><button id="stashWork" class="primary">暂存当前</button></div><div id="workList" class="work-list"></div><div class="shelf-actions"><label style="font-size:12px;display:flex;align-items:center;gap:5px"><input id="selectWorks" type="checkbox" checked>全选</label></div></div></div><div class="panel export-panel"><h2>导出图标</h2><div class="export-naming" style="padding:14px;background:#f5f8fd;border-radius:10px"><strong>导出命名</strong><div class="bar" style="margin-top:8px"><label for="filename">图标名称 <input id="filename" type="text" value="trend" placeholder="如 etf-diagnosis" aria-label="图标名称"></label><label for="fileversion">版本 <input id="fileversion" type="number" min="1" max="999" value="1" style="width:65px;border:1px solid #d8e3ee;border-radius:7px;padding:8px"></label></div><div class="tiny" style="overflow-wrap:anywhere" id="filenamePreview" aria-live="polite"></div></div><div class="bar"><label>PNG 尺寸 <select id="size"><option value="28">0.25× · 28px</option><option value="56">0.5× · 56px</option><option selected value="112">1× · 112px</option><option value="256">256px</option><option value="512">512px</option><option value="1024">1024px</option></select></label><button class="primary" id="svgExport">下载 SVG</button><button class="primary" id="pngExport">下载 PNG</button></div><div class="batch-export" style="border-top:1px solid #e0e8f2;margin-top:22px;padding-top:18px"><h2 style="font-size:14px;margin-bottom:12px">暂存作品批量导出</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><button id="batchSVG">SVG ZIP</button><button id="batchPNG">PNG ZIP</button></div><div id="batchStatus" role="status" style="font-size:12px;color:#74899b;margin-top:10px"></div></div><div id="status" role="status"></div></div></div></main><div id="measure" class="hidden"></di (ok,no)=>{image.onload=ok;image.onerror=no;image.src=data});const canvas=document.createElement('canvas');canvas.width=image.width;canvas.height=image.height;if(image.width*image.height>16000000)throw Error('图片尺寸过大');const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0);const pixels=ctx.getImageData(0,0,image.width,image.height).data;let x0=image.width,y0=image.height,x1=0,y1=0;for(let y=0;y<image.height;y++)for(let x=0;x<image.width;x++)if(pixels[(y*image.width+x)*4+3]>16){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x+1);y1=Math.max(y1,y+1)}if(x1<=x0)throw Error('图片完全透明');if(x0===0&&y0===0&&x1===image.width&&y1===image.height&&pixels.every((v,i)=>i%4!==3||v===255))throw Error('PNG没有透明背景，转白后会成为整块矩形，请使用透明PNG');custom={type:'png',markup:`<image width="${image.width}" height="${image.height}" href="${data}"/>`,bounds:{x:x0,y:y0,width:x1-x0,height:y1-y0}}}else throw Error('请选择SVG或PNG');if(!$('glyphs').querySelector('[data-key=custom]')){const b=document.createElement('button');b.dataset.key='custom';b.title='上传图案';b.setAttribute('aria-label','上传图案');$('glyphs').append(b)}$('deleteCustom').hidden=false;const customButton=$('glyphs').querySelector('[data-key=custom]');if(customButton)customButton.innerHTML=glyphButton('custom');state.glyph='custom';$('customLabel').textContent='已使用：'+file.name;render()}catch(e){$('customLabel').textContent='上传失败：'+e.message}finally{$('upload').value=''}};render();
</script></html>
